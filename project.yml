name: Trace
options:
  bundleIdPrefix: com.iannorris
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_PREVIEWS: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Trace:
    type: application
    platform: iOS
    sources:
      - path: Trace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iannorris.trace
        DEVELOPMENT_TEAM: LT3456KW44
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Trace uses your location to suggest runs near you."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Trace
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
